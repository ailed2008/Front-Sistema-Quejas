<div class="login-page">
  <div class="login-box">

    <div class="login-header">
      <div class="login-logo">Banco <span>SGB</span></div>
      <div class="login-subtitle">Registro de Nuevo Operador</div>
    </div>

    <div class="login-body">

      <div *ngIf="mensajeRespuesta" class="alert"
           [ngClass]="esError ? 'alert-danger' : 'alert-success'" role="alert">
        {{ mensajeRespuesta }}
      </div>

      <form [formGroup]="registerForm" (ngSubmit)="onRegister()">

        <div class="mb-3">
          <label for="username" class="form-label">Usuario</label>
          <input type="text" id="username" class="form-control"
                 formControlName="username"
                 placeholder="usuario@banco.com">
          <div *ngIf="registerForm.get('username')?.invalid && registerForm.get('username')?.touched"
               class="text-danger" style="font-size:0.76rem;margin-top:4px;">
            El usuario es obligatorio.
          </div>
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">Contraseña</label>
          <input type="password" id="password" class="form-control"
                 formControlName="password"
                 placeholder="••••••••">
          <div *ngIf="registerForm.get('password')?.invalid && registerForm.get('password')?.touched"
               class="text-danger" style="font-size:0.76rem;margin-top:4px;">
            Mínimo 6 caracteres.
          </div>
        </div>

        <div class="mb-4">
          <label for="rol" class="form-label">Perfil de Acceso</label>
          <select id="rol" class="form-select" formControlName="rol">
            <option value="EJECUTIVO">Ejecutivo</option>
            <option value="ADMIN">Administrador</option>
          </select>
        </div>

        <button type="submit" class="btn-bank w-100" [disabled]="cargando">
          <span *ngIf="cargando" class="spinner-border spinner-border-sm me-2" role="status"></span>
          {{ cargando ? 'Creando cuenta...' : 'Crear Cuenta' }}
        </button>

      </form>

      <div class="text-center mt-3">
        <a routerLink="/login"
           style="font-size:0.78rem;color:#0a2d6e;text-decoration:none;letter-spacing:0.03em;">
          ← Volver al inicio de sesión
        </a>
      </div>

    </div>
  </div>
</div>
