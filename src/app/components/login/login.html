<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card shadow-lg border-0 rounded-4">
        <div class="card-header bg-dark text-white text-center py-3 rounded-top-4">
          <h3 class="mb-0 fw-bold">Iniciar Sesión</h3>
          <p class="small mb-0 text-white-50">Sistema de Gestión Bancario</p>
        </div>
        <div class="card-body p-4">
          
          <!-- Alerta de error -->
          <div *ngIf="mensajeError" class="alert alert-danger" role="alert">
            {{ mensajeError }}
          </div>

          <!-- Formulario Reactivo -->
          <form [formGroup]="loginForm" (ngSubmit)="onLogin()">
            <div class="mb-3">
              <label for="username" class="form-label fw-semibold">Correo / Usuario</label>
              <input type="text" id="username" class="form-control" formControlName="username" placeholder="usuario@banco.com">
            </div>

            <div class="mb-4">
              <label for="password" class="form-label fw-semibold">Contraseña</label>
              <input type="password" id="password" class="form-control" formControlName="password" placeholder="********">
            </div>

            <div class="d-grid">
              <button type="submit" class="btn btn-dark fw-bold py-2" [disabled]="cargando">
                <span *ngIf="cargando" class="spinner-border spinner-border-sm me-2" role="status"></span>
                {{ cargando ? 'Entrando...' : 'Ingresar' }}
              </button>
            </div>
          </form>

        </div>
      </div>
    </div>
  </div>
</div>
