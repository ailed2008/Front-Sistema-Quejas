<div class="login-page">
  <div class="login-box">

    <div class="login-header">
      <div class="login-logo">Banco <span>SGB</span></div>
      <div class="login-subtitle">Sistema de Gestión Bancario</div>
    </div>

    <div class="login-body">

      <div *ngIf="mensajeError" class="alert alert-danger border-danger mb-3" role="alert">
        {{ mensajeError }}
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onLogin()">

        <div class="mb-3">
          <label for="username" class="form-label">Usuario</label>
          <input type="text" id="username" class="form-control"
                 formControlName="username"
                 placeholder="usuario@banco.com"
                 autocomplete="username">
        </div>

        <div class="mb-4">
          <label for="password" class="form-label">Contraseña</label>
          <input type="password" id="password" class="form-control"
                 formControlName="password"
                 placeholder="••••••••"
                 autocomplete="current-password">
        </div>

        <button type="submit" class="btn-bank w-100" [disabled]="cargando">
          <span *ngIf="cargando" class="spinner-border spinner-border-sm me-2" role="status"></span>
          {{ cargando ? 'Verificando...' : 'Iniciar Sesión' }}
        </button>

      </form>

    </div>
  </div>
</div>
