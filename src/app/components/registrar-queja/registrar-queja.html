<div class="container py-4" style="max-width:780px;">

  <div class="bank-panel">

    <div class="bank-panel-header">
      <div>
        <h3>Registro de Queja</h3>
        <div class="header-subtitle">Tarjeta de crédito &mdash; Captura de reclamación</div>
      </div>
    </div>

    <div class="bank-panel-body">

      <div *ngIf="mensajeRespuesta" class="alert"
           [ngClass]="esError ? 'alert-danger' : 'alert-success'" role="alert">
        {{ mensajeRespuesta }}
      </div>

      <form [formGroup]="quejaForm" (ngSubmit)="onSubmit()">

        <div class="row g-3 mb-3">

          <div class="col-md-6">
            <label for="folio" class="form-label">Folio</label>
            <input type="text" id="folio" class="form-control"
                   formControlName="folio"
                   placeholder="Ej. QTC-001"
                   style="text-transform:uppercase;">
            <div *ngIf="quejaForm.get('folio')?.invalid && quejaForm.get('folio')?.touched"
                 class="text-danger" style="font-size:0.76rem;margin-top:4px;">
              Folio obligatorio (mín. 3 caracteres).
            </div>
          </div>

          <div class="col-md-6">
            <label for="numCliente" class="form-label">N° de Cliente</label>
            <input type="text" id="numCliente" class="form-control"
                   formControlName="numCliente"
                   placeholder="Ej. CLI-98765">
            <div *ngIf="quejaForm.get('numCliente')?.invalid && quejaForm.get('numCliente')?.touched"
                 class="text-danger" style="font-size:0.76rem;margin-top:4px;">
              Campo obligatorio.
            </div>
          </div>

        </div>

        <div class="row g-3 mb-3">

          <div class="col-md-6">
            <label for="montoReclamado" class="form-label">Monto Reclamado (MXN)</label>
            <input type="number" step="0.01" id="montoReclamado" class="form-control"
                   formControlName="montoReclamado"
                   placeholder="0.00">
            <div *ngIf="quejaForm.get('montoReclamado')?.invalid && quejaForm.get('montoReclamado')?.touched"
                 class="text-danger" style="font-size:0.76rem;margin-top:4px;">
              Ingrese un monto mayor a $0.
            </div>
          </div>

          <div class="col-md-6">
            <label for="prioridad" class="form-label">Prioridad SLA</label>
            <select id="prioridad" class="form-select" formControlName="prioridad">
              <option value="BAJA">Baja — 20 días hábiles</option>
              <option value="MEDIA">Media — 10 días hábiles</option>
              <option value="ALTA">Alta — 5 días hábiles</option>
            </select>
          </div>

        </div>

        <div class="mb-3">
          <label for="lugarSuceso" class="form-label">Lugar del Suceso / Sucursal</label>
          <input type="text" id="lugarSuceso" class="form-control"
                 formControlName="lugarSuceso"
                 placeholder="Ej. CDMX — Sucursal Polanco">
          <div *ngIf="quejaForm.get('lugarSuceso')?.invalid && quejaForm.get('lugarSuceso')?.touched"
               class="text-danger" style="font-size:0.76rem;margin-top:4px;">
            Campo obligatorio.
          </div>
        </div>

        <div class="mb-4">
          <label for="horaTransaccion" class="form-label">Fecha y Hora de la Transacción</label>
          <input type="datetime-local" id="horaTransaccion" class="form-control"
                 formControlName="horaTransaccion"
                 min="2000-01-01T00:00"
                 max="2099-12-31T23:59">
          <div *ngIf="quejaForm.get('horaTransaccion')?.invalid && quejaForm.get('horaTransaccion')?.touched"
               class="text-danger" style="font-size:0.76rem;margin-top:4px;">
            Seleccione fecha y hora válidas.
          </div>
        </div>

        <!-- Separador -->
        <hr style="border-color:#e2e6ea;margin-bottom:1.25rem;">

        <div class="d-flex justify-content-end gap-2">
          <button type="button" class="btn-bank-outline" routerLink="/lista-quejas">
            Cancelar
          </button>
          <button type="submit" class="btn-bank" [disabled]="cargando">
            <span *ngIf="cargando" class="spinner-border spinner-border-sm me-2" role="status"></span>
            {{ cargando ? 'Registrando...' : 'Registrar Queja' }}
          </button>
        </div>

      </form>

    </div>
  </div>

</div>
