<nav class="navbar-bank">
  <div class="d-flex align-items-center justify-content-between w-100">

    <a class="navbar-brand" href="#">
      <span class="d-none d-md-inline">Sistema de </span><span class="brand-accent">Gestión Bancario</span>
    </a>

    <!-- Botón hamburguesa móvil -->
    <button class="navbar-toggler-bank d-md-none" (click)="menuAbierto = !menuAbierto"
            [attr.aria-expanded]="menuAbierto">
      <span></span><span></span><span></span>
    </button>

    <!-- Links escritorio -->
    <div class="nav-links d-none d-md-flex align-items-center gap-3">
      <a class="nav-link" routerLink="/lista-quejas" routerLinkActive="active">Quejas</a>
      <a class="nav-link" routerLink="/registro-queja" routerLinkActive="active">Nueva Queja</a>
      <span class="badge-rol">{{ esAdmin ? 'Administrador' : 'Ejecutivo' }}</span>
      <button class="btn-logout" (click)="logout()">Cerrar Sesión</button>
    </div>

  </div>

  <!-- Menú móvil desplegable -->
  <div class="nav-mobile w-100" *ngIf="menuAbierto">
    <a class="nav-mobile-link" routerLink="/lista-quejas" routerLinkActive="active"
       (click)="menuAbierto = false">Quejas</a>
    <a class="nav-mobile-link" routerLink="/registro-queja" routerLinkActive="active"
       (click)="menuAbierto = false">Nueva Queja</a>
    <div class="nav-mobile-footer">
      <span class="badge-rol">{{ esAdmin ? 'Administrador' : 'Ejecutivo' }}</span>
      <button class="btn-logout" (click)="logout(); menuAbierto = false">Cerrar Sesión</button>
    </div>
  </div>
</nav>
